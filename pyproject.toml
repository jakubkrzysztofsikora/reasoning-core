[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reasoning-core"
version = "0.3.0"
description = "Local pre-edit gate for AI coding CLIs: audit/warn (default) or block (opt-in) on edits that drift off-plan, import what's banned, or break invariants."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jakub Sikora" }]
keywords = ["ai-coding", "static-analysis", "mamba", "ssm", "pre-edit-gate", "claude-code", "codex", "gemini-cli", "copilot", "vibe", "kimi", "pi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
urls = { Homepage = "https://github.com/jakubkrzysztofsikora/reasoning-core", Issues = "https://github.com/jakubkrzysztofsikora/reasoning-core/issues" }

# `full` is the canonical install target — it pulls every runtime dependency
# `pip install -r requirements.txt` used to install, so the wheel is
# drop-in equivalent for end users. Optional extras cover narrower cases.
[project.optional-dependencies]
full = [
  "setproctitle==1.3.7",
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.29,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.6,<3.0",
  "mcp[cli]>=1.0,<2.0",
  "tree-sitter>=0.25,<0.27",
  "tree-sitter-python>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23",
  "tree-sitter-c-sharp>=0.23",
  "tree-sitter-sql>=0.3",
  "tree-sitter-markdown>=0.3",
  "tree-sitter-json>=0.23",
  "tree-sitter-yaml>=0.7",
  "tree-sitter-css>=0.20",
  "tree-sitter-html>=0.20",
  "tree-sitter-dockerfile>=0.2",
  "transformers>=4.39,<5.0",
  "torch>=2.2,<3.0",
  "accelerate>=0.27",
  "safetensors>=0.4",
  "sentencepiece>=0.1.99",
  "einops>=0.7",
  "ruff>=0.6,<1.0",
  "portalocker>=2.7",
  "psutil>=5.9",
  "llama-cpp-python>=0.2.90",
  "PyYAML>=6.0",
]
# CPU-only torch pinning for small VMs / CI without a CUDA host.
embed-cpu = [
  "torch>=2.2,<3.0",
  "transformers>=4.39,<5.0",
  "accelerate>=0.27",
  "safetensors>=0.4",
  "sentencepiece>=0.1.99",
  "einops>=0.7",
]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23",
  "pytest-timeout>=2.2",
]

# `pip install reasoning-core[full]` exposes `rc` on PATH; the binary
# dispatches into src.rc_cli.main() exactly like bin/rc used to do, but
# without needing the source tree on disk.
[project.scripts]
rc = "src.rc_cli:main"

[tool.setuptools]
packages = ["src", "src.hooks", "src.data"]
# Templates and CLI scaffold assets ship inside the wheel as package data
# so hooks and `rc init` can read them via importlib.resources.files("src.data")
# whether the framework is running from a checkout or an installed wheel.
include-package-data = true

[tool.setuptools.package-data]
"src.data" = [
  "templates/*.json",
  "templates/*.json.template",
  "templates/*.toml",
  "templates/*.toml.template",
  "templates/*.md",
  "templates/*.ts",
  "templates/**/*.json",
  "templates/**/*.json.template",
  "templates/**/*.toml",
  "templates/**/*.toml.template",
  "templates/**/*.md",
  "templates/**/*.ts",
  "templates/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = [".git", ".venv", "venv", "build", "dist", "*.egg-info", "__pycache__", "hf_cache", ".cache"]
addopts = "-q --strict-markers --rootdir=."
consider_namespace_packages = false
markers = [
  "live: requires live network and Scaleway credentials (gated by RC_LIVE=1)",
  "slow: takes >5s; auto-runs in CI with timeout",
]
timeout = 120
