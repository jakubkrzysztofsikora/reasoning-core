# reasoning-core-pr-score.yml
#
# Scores every source file changed in a PR and posts a Markdown report.
# Defaults to the lightweight symbolic gate (no GPU / no model download).
#
# Use in another repo:
#   jobs:
#     score:
#       uses: jakubkrzysztofsikora/reasoning-core/.github/workflows/reasoning-core-pr-score.yml@main
#       secrets: inherit
#
# Or use the Marketplace action directly:
#   - uses: jakubkrzysztofsikora/reasoning-core@main
#     with:
#       base-ref: origin/main

name: reasoning-core PR score

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      base-ref:
        description: "Base git ref"
        type: string
        default: "origin/main"
      head-ref:
        description: "Head git ref"
        type: string
        default: "HEAD"
      mode:
        description: "symbolic or sidecar"
        type: string
        default: "symbolic"
      include:
        description: "Comma-separated file-extension globs"
        type: string
        default: ""
      fail-on-block:
        description: "Fail the check if any file is blocked"
        type: boolean
        default: false
      sidecar:
        description: "Boot the SSM sidecar (requires heavy deps)"
        type: boolean
        default: false
      post-comment:
        description: "Post the report as a PR comment"
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: rc-pr-score-${{ github.ref }}
  cancel-in-progress: true

jobs:
  score:
    name: Score PR changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RC_SCORE_MODE: ${{ inputs.mode || 'symbolic' }}
      RC_SCORE_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (inputs.base-ref || 'origin/main') }}
      RC_SCORE_HEAD_REF: ${{ github.event_name == 'pull_request' && github.sha || (inputs.head-ref || 'HEAD') }}
      RC_SCORE_INCLUDE: ${{ inputs.include || '' }}
      RC_SCORE_FAIL_ON_BLOCK: ${{ github.event_name == 'pull_request' && 'false' || (inputs.fail-on-block && 'true' || 'false') }}
      RC_SCORE_SIDECAR: ${{ inputs.sidecar && 'true' || 'false' }}
      RC_SCORE_POST_COMMENT: ${{ github.event_name == 'pull_request' && 'true' || (inputs.post-comment && 'true' || 'false') }}
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Score with reasoning-core
        uses: ./
        with:
          base-ref: ${{ env.RC_SCORE_BASE_REF }}
          head-ref: ${{ env.RC_SCORE_HEAD_REF }}
          mode: ${{ env.RC_SCORE_MODE }}
          include: ${{ env.RC_SCORE_INCLUDE }}
          fail-on-block: ${{ env.RC_SCORE_FAIL_ON_BLOCK }}
          sidecar: ${{ env.RC_SCORE_SIDECAR }}
          post-comment: ${{ env.RC_SCORE_POST_COMMENT }}
