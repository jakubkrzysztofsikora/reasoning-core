# Phase 5: Multi-CLI parity matrix.
#
# Two jobs:
#   verified     — hosts whose verification gate has cleared. Hard fail on regressions.
#   experimental — hosts pending deeper verification. Informational only.
#
# Verification clearance per 2026-05-08 hands-on probe:
#   gemini  v0.37.1   ✓ Claude-compatible hooks ✓ MCP ✓ skills
#   copilot v1.0.29   ✓ MCP ✓ skills (NO hooks subcommand — MCP-only)
#   vibe    v2.9.4    ✓ MCP ✓ post_agent_turn hook
#
# Sidecar is NOT required: these tests exercise only adapter parsing,
# template rendering, and install-script smoke tests. End-to-end agent
# runs against the live sidecar live in eval.yml.
name: multi-cli

on:
  # Run on every PR (no paths filter): an install.sh / uninstall.sh / docs
  # change can break the multi-CLI install contract just as easily as a
  # change under src/hooks/adapters. The matrix is cheap (~2 min/cell) and
  # the user-facing complaint that some recent PRs landed green-with-errors
  # in logs argues for *more* coverage, not less.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verified:
    name: verified-${{ matrix.host }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [claude, gemini, copilot, vibe]
    env:
      S2_FAIL_CLOSED: "0"  # adapter tests don't need a sidecar
      RC_LIVE: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install python deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # Minimal set the adapter+smoke tests need. If a test transitively
          # pulls in something heavier (torch / transformers / tree_sitter),
          # pytest will report ERROR rather than masking it as a skip.
          pip install portalocker pytest pytest-timeout httpx mcp
      - name: Run host-specific adapter + smoke tests
        # -ra: summarise all skips/errors/xfails at the bottom of the run so a
        # silently-skipped test is visible in CI logs.
        # --strict-markers: a typo in a marker becomes a failure, not a warn.
        # --maxfail=1: stop on first failure so the log isn't drowned in
        # downstream cascades.
        run: |
          set -euo pipefail
          export RC_HOST=${{ matrix.host }}
          export RC_REPO=$(pwd)
          if [ "${{ matrix.host }}" = "claude" ]; then
            python -m pytest \
              tests/test_host_env.py tests/test_adapter_claude.py \
              tests/test_skill_drift.py tests/test_enable_in_repo_backcompat.py \
              -ra --strict-markers --maxfail=1 --timeout=30
          else
            python -m pytest \
              tests/test_adapter_${{ matrix.host }}.py tests/test_skill_drift.py \
              -ra --strict-markers --maxfail=1 --timeout=30
          fi
      - name: Smoke-test legacy enable-in-repo-${{ matrix.host }}.sh
        # Per-host script — gemini / copilot / vibe each have one. Claude
        # is covered by enable-in-repo.sh + the back-compat pytest above.
        if: matrix.host != 'claude'
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cd "$tmp"
          git init -q
          touch .envrc
          export RC_REPO=$GITHUB_WORKSPACE
          bash "$RC_REPO/scripts/enable-in-repo-${{ matrix.host }}.sh"
          # Validate generated config parses.
          if [ "${{ matrix.host }}" = "gemini" ]; then
            python -c "import json; json.load(open('.gemini/settings.json'))"
          elif [ "${{ matrix.host }}" = "vibe" ]; then
            python -c "import tomllib; tomllib.load(open('.vibe/config.toml','rb'))"
          fi
      - name: Smoke-test unified install.sh / uninstall.sh round-trip
        # Runs once per matrix host (the unified installer wires ALL hosts;
        # matrix gives us four independent fresh runs per PR). HOME is
        # redirected to a sandbox so the test doesn't mutate the runner's
        # real ~/.copilot or ~/.vibe state.
        if: hashFiles('install.sh') != ''
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          fake_home=$(mktemp -d)
          cd "$tmp"
          git init -q
          touch .gitignore
          HOME="$fake_home" bash "$GITHUB_WORKSPACE/install.sh"
          test -f .envrc                          || { echo "::error::install.sh did not write .envrc";                     exit 1; }
          test -f .claude/settings.local.json     || { echo "::error::install.sh did not write .claude/settings.local.json"; exit 1; }
          test -f .gemini/settings.json           || { echo "::error::install.sh did not write .gemini/settings.json";       exit 1; }
          test -f .copilot/copilot-instructions.md || { echo "::error::install.sh did not write .copilot/copilot-instructions.md"; exit 1; }
          test -f .vibe/config.toml               || { echo "::error::install.sh did not write .vibe/config.toml";           exit 1; }
          test -f .reasoning-core/install.manifest || { echo "::error::install.sh did not write the manifest";               exit 1; }
          python -c "import json; json.load(open('.claude/settings.local.json'))"
          python -c "import json; json.load(open('.gemini/settings.json'))"
          python -c "import tomllib; tomllib.load(open('.vibe/config.toml','rb'))"
          python -c "import json; json.load(open('$fake_home/.copilot/mcp-config.json'))"
          # Round-trip
          HOME="$fake_home" bash "$GITHUB_WORKSPACE/uninstall.sh"
          # After uninstall, only .git/, .gitignore (plus possibly the
          # `tricky&path with spaces` parent on test runs) should remain.
          remaining=$(ls -A | grep -vxE '\.git|\.gitignore' || true)
          if [[ -n "$remaining" ]]; then
            echo "::error::uninstall.sh left files behind: $remaining"
            exit 1
          fi
          # Re-install must be idempotent — second pass touches nothing
          # fatally.
          HOME="$fake_home" bash "$GITHUB_WORKSPACE/install.sh"
          HOME="$fake_home" bash "$GITHUB_WORKSPACE/install.sh"  # second pass = no-op
          rm -rf "$tmp" "$fake_home"

  experimental:
    name: experimental-stub
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - run: echo "no experimental hosts at this time"
