name: wheel-build

# This is a pure-Python package. Build one universal wheel and an sdist.
# The reasoning-core name on PyPI is owned by another project, so releases
# are attached to GitHub tags instead of publishing to PyPI.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'src/**'
      - '.github/workflows/wheel-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Match release tag to package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python -c "import os,tomllib; v=tomllib.load(open('pyproject.toml','rb'))['project']['version']; assert os.environ['GITHUB_REF_NAME'] == 'v'+v"
      - name: Build and check distributions
        run: |
          python -m pip install 'build==1.2.2' 'twine==6.1.0' 'pytest==8.4.2' 'numpy==2.3.4' 'httpx==0.28.1' 'portalocker==3.2.0'
          python -m build
          python -m twine check dist/*
      - name: Check wheel contents and CLI
        run: |
          python -m venv /tmp/rc-wheel-smoke
          /tmp/rc-wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/rc-wheel-smoke/bin/python -c "import importlib.metadata as m; from importlib.resources import files; assert m.version('reasoning-core'); assert (files('src.data') / 'templates').is_dir()"
          /tmp/rc-wheel-smoke/bin/rc --help >/dev/null
      - name: Verify installed OMP assets and dependencies
        run: |
          RC_TEST_WHEEL="$(realpath dist/*.whl)" python -m pytest tests/test_omp_wheel.py
      - name: Record exact distribution provenance
        env:
          RC_BUILD_SHA: ${{ github.sha }}
          RC_RUN_ID: ${{ github.run_id }}
        run: |
          python -c 'import hashlib,json,os,pathlib; p=pathlib.Path("dist"); rows={f.name:hashlib.sha256(f.read_bytes()).hexdigest() for f in p.iterdir() if f.is_file()}; (p/"provenance.json").write_text(json.dumps({"source_sha":os.environ["RC_BUILD_SHA"],"run_id":os.environ["RC_RUN_ID"],"sha256":rows},indent=2)+"\n")'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reasoning-core-distributions
          path: dist/*

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: reasoning-core-distributions
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
