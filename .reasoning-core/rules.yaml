corpus_version: v1
rules:
  - id: no_hooks_import_supervisor
    type: forbid_import
    severity: deny
    language: python
    target: src.sidecar_supervisor
    scope: src/hooks/**
    message: "Hooks must not import sidecar_supervisor directly"

  - id: no_shell_true
    type: forbid_pattern
    severity: deny
    language: python
    pattern: 'subprocess\.run\s*\([^)]*shell\s*=\s*True'
    scope: src/**
    message: "subprocess.run with shell=True is forbidden"

  - id: no_ts_hooks_import_supervisor
    type: forbid_import
    severity: deny
    language: typescript
    target: ../supervisor
    scope: src/**/hooks/**
    message: "TS hooks must not import supervisor"

  - id: no_ts_hooks_import_sidecar_supervisor
    type: forbid_import
    severity: deny
    language: typescript
    target: ../sidecar_supervisor
    scope: src/**/hooks/**
    message: "TS hooks must not import sidecar_supervisor"

  - id: no_eval_constructor
    type: forbid_pattern
    severity: deny
    language: javascript
    pattern: '(?:eval\s*\(|new\s+Function\s*\()'
    scope: src/**
    message: "Dynamic code execution via eval() or new Function() is forbidden"
